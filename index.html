<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafbf8" />
    <meta
      name="description"
      content="육계 생산지수를 계산하고 목표 PI에 필요한 평체, 사료요구율, 사육일령, 육성률을 비교합니다."
    />
    <link rel="icon" href="data:," />
    <title>생산 지수 시뮬레이터</title>
  </head>
  <body>
    <main>
      <h1>생산 지수 시뮬레이터</h1>
      <div class="goal-strip">
        <div class="goal-current">
          <span>현재 PI</span
          ><output id="pi-result" aria-label="현재 PI">—</output>
        </div>
        <label class="goal-target" for="target"
          >목표 PI<input
            id="target"
            type="number"
            inputmode="decimal"
            min="0"
            step="any"
            required
            aria-describedby="error-target"
        /></label>
      </div>
      <p id="error-target" class="field-error"></p>

      <h2 class="input-heading">현재 조건</h2>
      <form id="pi-form" class="input-grid" novalidate>
        <label class="number-field" for="livability"
          >육성률<span class="input-with-unit"
            ><input
              id="livability"
              type="number"
              inputmode="decimal"
              min="0"
              step="any"
              required
              aria-describedby="error-livability"
            /><span class="input-unit" aria-hidden="true">%</span></span
          ><small id="error-livability" class="field-error"></small
        ></label>
        <label class="number-field" for="weight"
          >평체<span class="input-with-unit"
            ><input
              id="weight"
              type="number"
              inputmode="decimal"
              min="0"
              step="any"
              required
              aria-describedby="error-weight"
            /><span class="input-unit" aria-hidden="true">kg</span></span
          ><small id="error-weight" class="field-error"></small
        ></label>
        <label class="number-field" for="age"
          >사육일령<span class="input-with-unit"
            ><input
              id="age"
              type="number"
              inputmode="decimal"
              min="0"
              step="any"
              required
              aria-describedby="error-age"
            /><span class="input-unit" aria-hidden="true">일</span></span
          ><small id="error-age" class="field-error"></small
        ></label>
        <label class="number-field" for="fcr"
          >사료요구율<span class="input-with-unit"
            ><input
              id="fcr"
              type="number"
              inputmode="decimal"
              min="0"
              step="any"
              required
              aria-describedby="error-fcr" /></span
          ><small id="error-fcr" class="field-error"></small
        ></label>
      </form>

      <section aria-labelledby="targets-title">
        <div class="section-line target-heading">
          <h2 id="targets-title">목표 PI를 달성하기 위해선</h2>
        </div>
        <table class="target-table">
          <thead>
            <tr>
              <th scope="col">항목</th>
              <th scope="col">필요한 값</th>
              <th scope="col">변화량</th>
            </tr>
          </thead>
          <tbody id="target-rows"></tbody>
        </table>
        <p class="tap-hint">필요한 값을 누르면 해당 조건으로 계산합니다.</p>
      </section>

      <div class="scenario-summary">
        <div>
          <span id="scenario-label" class="fine">현재 조건</span
          ><strong id="scenario-pi">PI —</strong
          ><span id="scenario-status" class="fine"></span>
        </div>
        <button type="button" id="save-record" class="primary" disabled>
          기록 저장
        </button>
      </div>
      <p id="save-status" class="save-status" role="status"></p>

      <section class="records-section" aria-labelledby="records-title">
        <div class="section-line records-heading">
          <h2 id="records-title">
            저장한 기록 <span id="record-count"></span>
          </h2>
          <button
            type="button"
            id="records-toggle"
            class="secondary"
            aria-expanded="true"
            aria-controls="records"
          >
            가리기
          </button>
        </div>
        <div id="records"></div>
        <p class="storage-note">최대 50개 저장</p>
      </section>

      <details class="formula">
        <summary>계산 기준</summary>
        <div
          class="formula-equation"
          role="math"
          aria-label="PI는 육성률 곱하기 평체를 사육일령 곱하기 사료요구율로 나눈 값에 100을 곱합니다."
        >
          <strong>PI</strong><span>=</span>
          <span class="formula-fraction"
            ><span>육성률 × 평체</span><span>사육일령 × 사료요구율</span></span
          >
          <span>× 100</span>
        </div>
        <p>각 필요값은 다른 세 조건을 그대로 두고 계산합니다.</p>
      </details>
      <div
        id="calculation-status"
        class="sr-only"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
